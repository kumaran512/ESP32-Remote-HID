[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
; Pioarduino provides a dedicated ESP32-S3 N16R8 board definition.
; Pin this version for reproducible Codespaces builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200

; Native USB HID is required by the project.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1

; Persistent settings use NVS; no filesystem is required.
lib_compat_mode = strict
lib_ldf_mode = chain

; Persistent WebSocket/HTTP server. 3.6.0 supports current Arduino 3.x cores.
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    ESP32Async/AsyncTCP @ 3.3.2
